[build-system]
requires = ["setuptools==80.10.2", "setuptools-scm==9.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-caravan"
dynamic = ["version"]
description = "Runtime-neutral organization and team framework utilities"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
agent-caravan = "agentcaravan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
