name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and build dependencies
        run: python -m pip install -e . -r requirements.txt
      - name: Preflight
        run: make preflight
      - name: Unit and integration tests
        run: make test
      - name: Resolve example
        run: make resolve-example
      - name: CLI smoke test
        run: make cli-smoke
      - name: Build and test installed wheel
        run: make package-smoke

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Validate release request and create local version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run the release workflow from main."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists. Choose a new version."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release for ${RELEASE_TAG} already exists. Choose a new version."
            exit 1
          fi
          git tag -a "$RELEASE_TAG" -m "Agent Caravan ${RELEASE_TAG#v}" "$GITHUB_SHA"
      - name: Install pinned build and publication tools
        run: python -m pip install -r requirements.txt
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Create GitHub Release with package files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: gh release create "$RELEASE_TAG" dist/* --title "Agent Caravan $RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"
