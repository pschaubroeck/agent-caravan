name: CI

on:
  push:
    branches: ["**"]
  create:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'create' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and build dependencies
        run: python -m pip install -e . -r requirements.txt
      - name: Preflight
        run: make preflight
      - name: Unit and integration tests
        run: make test
      - name: Resolve example
        run: make resolve-example
      - name: CLI smoke test
        run: make cli-smoke
      - name: Build and test installed wheel
        run: make package-smoke

  release:
    if: github.event_name == 'create' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned build and publication tools
        run: python -m pip install -r requirements.txt
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Create a draft release when one does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Agent Caravan $GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Attach package files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Publish release after checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
