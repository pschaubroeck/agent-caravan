name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and build dependencies
        run: python -m pip install -e . -r requirements.txt
      - name: Preflight
        run: make preflight
      - name: Unit and integration tests
        run: make test
      - name: Resolve example
        run: make resolve-example
      - name: CLI smoke test
        run: make cli-smoke
      - name: Build and test installed wheel
        run: make package-smoke
